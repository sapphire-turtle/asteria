# cargo-deny config. Run locally with `cargo deny check`.
# Reference: https://embarkstudios.github.io/cargo-deny/
#
# The shared starting point for sapphire-turtle repositories
# (sapphire-framework/ci/templates/deny.toml). Keep repository-specific entries
# under `ignore` and `exceptions`, each with its reason.

[graph]
# The platforms release binaries are published for. Drops UEFI/WASM-only
# transitive dependencies such as `r-efi`, so their licenses need no allowing.
targets = [
    "x86_64-unknown-linux-gnu",
    "aarch64-unknown-linux-gnu",
    "aarch64-apple-darwin",
    "x86_64-pc-windows-msvc",
]
all-features = true

[advisories]
yanked = "warn"
# Every ignore needs a `reason`, so the next contributor can tell whether it is
# still load-bearing. Re-check them when the dependency they name moves.
ignore = [
    { id = "RUSTSEC-2024-0436", reason = "proc-macro pulled in by lofty, used only as a test dev-dependency; revisit when asteria-music uses lofty at runtime (Plan 5)" },
    # Unmaintained, with no vulnerability and no safe upgrade. Same entries as corundum-framework,
    # whose eframe window brings them in for asteria-photos.
    { id = "RUSTSEC-2026-0192", reason = "ttf-parser is unmaintained (author-declared); corundum's gui crate reads font files with it directly and through fontdb. The suggested alternative (skrifa) is a different font stack." },
    { id = "RUSTSEC-2026-0370", reason = "zvariant is unmaintained as a standalone crate (merged into zbus 6). Reached via eframe > egui-winit > accesskit_winit > accesskit_unix (Linux screen reader support), whose latest release still pins zbus ^5.19 and atspi ^0.29. Drop when accesskit_unix moves to zbus 6." },
    { id = "RUSTSEC-2026-0371", reason = "zbus_names is unmaintained as a standalone crate (merged into zbus 6). Same path and reason as RUSTSEC-2026-0370." },
    { id = "RUSTSEC-2026-0372", reason = "zvariant_derive is unmaintained as a standalone crate (merged into zbus 6). Same path and reason as RUSTSEC-2026-0370." },
]

[licenses]
# Permissive SPDX identifiers. Re-survey with `cargo deny list --layout license`
# before widening; prefer a per-crate entry under `exceptions` to adding here.
allow = [
    "0BSD",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "BSL-1.0",
    "CC0-1.0",
    "CDLA-Permissive-2.0",
    "ISC",
    "MIT",
    "MIT-0",
    "MPL-2.0",
    "Unicode-3.0",
    "Unlicense",
    "Zlib",
]
confidence-threshold = 0.93
exceptions = [
    # asteria's own application crate is GPL-3.0-or-later with an app store
    # exception (LICENSE.App-Store-Exception). Scoped to that crate, so a GPL
    # dependency cannot slip in unnoticed:
    { name = "asteria-framework", allow = ["GPL-3.0-or-later"] },
    { name = "asteria-framework-server", allow = ["GPL-3.0-or-later"] },
    { name = "asteria-framework-client", allow = ["GPL-3.0-or-later"] },
    { name = "asteria-photos", allow = ["GPL-3.0-or-later"] },
    { name = "asteria-photos-server", allow = ["GPL-3.0-or-later"] },
    { name = "asteria-music", allow = ["GPL-3.0-or-later"] },
    { name = "asteria-music-server", allow = ["GPL-3.0-or-later"] },
    # egui's fallback UI font is under the OFL and the Ubuntu Font Licence: they govern the
    # typefaces it embeds, not code, so they are scoped to this crate rather than allowed
    # for every dependency.
    { name = "epaint_default_fonts", allow = ["OFL-1.1", "Ubuntu-font-1.0"] },
]

[bans]
# Duplicate versions are too common in real workspaces to be worth a warning.
multiple-versions = "allow"
wildcards = "deny"
# A `path` dependency without a version (a workspace crate's dev-dependency, or a
# crate that is not published) is not a wildcard on the registry.
allow-wildcard-paths = true

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
allow-git = []
