[package]
# What the photos and music desktop apps share about the server on this computer: the
# first-run flow that sets it up, the "Local server" settings page, its background service
# and the external tools it needs. Only the desktop crates depend on it.
name = "asteria-framework-desktop"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
publish = false

[dependencies]
asteria-framework = { path = "../asteria-framework" }
asteria-framework-server = { path = "../asteria-framework-server" }
asteria-framework-client = { path = "../asteria-framework-client" }
corundum-framework = { workspace = true, features = ["gui", "serde", "eframe", "gui-service", "gui-keys", "gui-package", "single-instance", "console"] }
tracing.workspace = true

[dev-dependencies]
tempfile.workspace = true
