[package]
name = "asteria-ios-spike"
version = "0.1.0"
edition = "2024"
license = "GPL-3.0-or-later"
publish = false

[lib]
name = "asteria_ios_spike"
crate-type = ["staticlib", "rlib"]

[dependencies]
blake3 = { version = "1", features = ["pure"] }
corundum-gui = { git = "https://github.com/sapphire-turtle/sapphire-framework", rev = "bb7c34fbdf35ea7a46121aa70d53f3107d033619" }
eframe = { version = "0.36", default-features = false, features = ["wgpu", "default_fonts"] }
cpal = "0.18"
log = "0.4"
opus-probe = { path = "../opus-probe" }

[target.'cfg(target_os = "linux")'.dependencies]
eframe = { version = "0.36", default-features = false, features = ["wgpu", "default_fonts", "x11", "wayland"] }

[target.'cfg(target_os = "ios")'.dependencies]
objc2 = "0.6"
block2 = "0.6"
dispatch2 = "0.3"
objc2-avf-audio = { version = "0.3", features = ["AVAudioSession", "AVAudioSessionTypes"] }
objc2-foundation = { version = "0.3", features = ["block2", "NSArray", "NSData", "NSDate", "NSDictionary", "NSError", "NSNotification", "NSObject", "NSOperation", "NSPredicate", "NSSortDescriptor", "NSString", "NSValue"] }
# Without default features, so it links Photos only, not AVFoundation, CoreMedia and the rest.
objc2-photos = { version = "0.3", default-features = false, features = ["std", "block2", "PHAsset", "PHAssetResource", "PHAssetResourceManager", "PHFetchOptions", "PHFetchResult", "PHObject", "PHPhotoLibrary", "PhotosTypes"] }
objc2-media-player = { version = "0.3", features = ["block2", "MPMediaItem", "MPNowPlayingInfoCenter", "MPRemoteCommand", "MPRemoteCommandCenter", "MPRemoteCommandEvent"] }
objc2-ui-kit = { version = "0.3", features = ["UIPasteboard"] }
# The `log` feature makes winit's tracing events reach the `log` logger when no
# tracing subscriber is installed.
tracing = { version = "0.1", default-features = false, features = ["log"] }
