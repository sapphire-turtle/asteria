[workspace]
resolver = "3"
members = [
    "asteria-framework-api",
    "asteria-gallery-api",
    "asteria-player-api",
    "asteria-framework",
    "asteria-framework-server",
]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "GPL-3.0-or-later"
repository = "https://github.com/sapphire-turtle/project-asteria"

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "1"
blake3 = "1"
crc32fast = "1"
xml-rs = "0.8"
grain-id = { version = "0.15", features = ["serde"] }
chrono = { version = "0.4", features = ["serde"] }
thiserror = "2"
uuid = { version = "1", features = ["v4", "v5", "serde"] }
redb = "4"
tempfile = "3"
lofty = "0.22"
tracing = "0.1"
getrandom = "0.4"
base64 = "0.23"
dirs = "7"
walkdir = "2"
tokio = { version = "1", features = ["rt", "sync"] }
