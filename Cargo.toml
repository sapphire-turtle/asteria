[workspace]
resolver = "3"
members = [
    "crates/asteria-framework-api",
    "crates/asteria-photos-api",
    "crates/asteria-music-api",
    "crates/asteria-framework",
    "crates/asteria-framework-server",
    "crates/asteria-framework-client",
    "photos",
    "photos-server",
    "music-server",
]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "GPL-3.0-or-later"
repository = "https://github.com/sapphire-turtle/project-asteria"

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "1"
blake3 = "1"
crc32fast = "1"
xml-rs = "0.8"
grain-id = { version = "0.15", features = ["serde"] }
chrono = { version = "0.4", features = ["serde"] }
thiserror = "2"
uuid = { version = "1", features = ["v4", "v5", "serde"] }
redb = "4"
tempfile = "3"
lofty = "0.22"
tracing = "0.1"
getrandom = "0.4"
base64 = "0.23"
# The app's directories and, for the clients, the look shared with sapphire.
corundum-framework = "0.2.0"
walkdir = "2"
tokio = { version = "1", features = ["rt", "sync", "process", "time", "io-util", "macros"] }
tokio-util = "0.7"
notify = "8"
axum = { version = "0.8", default-features = false, features = ["http1", "json", "tokio", "query"] }
tower = { version = "0.5", features = ["util"] }
tracing-subscriber = "0.3"
http-body-util = "0.1"
tower-http = { version = "0.7", default-features = false, features = ["fs"] }
clap = { version = "4", features = ["derive"] }
url = { version = "2", features = ["serde"] }
reqwest = { version = "0.13", default-features = false, features = ["blocking", "json", "rustls"] }
bytes = "1"
image = { version = "0.25", default-features = false, features = ["webp"] }
