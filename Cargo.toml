[workspace]
resolver = "3"
members = [
    "asteria-framework-api",
    "asteria-gallery-api",
    "asteria-player-api",
    "asteria-framework",
    "asteria-framework-server",
    "asteria-gallery-server",
]
# The iOS spike is its own workspace with its own lockfile.
exclude = ["spikes"]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "GPL-3.0-or-later"
repository = "https://github.com/sapphire-turtle/project-asteria"

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "1"
blake3 = "1"
crc32fast = "1"
xml-rs = "0.8"
grain-id = { version = "0.15", features = ["serde"] }
chrono = { version = "0.4", features = ["serde"] }
thiserror = "2"
uuid = { version = "1", features = ["v4", "v5", "serde"] }
redb = "4"
tempfile = "3"
lofty = "0.22"
tracing = "0.1"
getrandom = "0.4"
base64 = "0.23"
# The app's directories and, for the clients, the look shared with sapphire. A git
# dependency until its first release on crates.io; then drop `git`.
corundum-framework = { version = "0.1.0", git = "https://github.com/sapphire-turtle/corundum-framework" }
walkdir = "2"
tokio = { version = "1", features = ["rt", "sync", "process", "time", "io-util", "macros"] }
tokio-util = "0.7"
notify = "8"
axum = { version = "0.8", default-features = false, features = ["http1", "json", "tokio", "query"] }
tower = { version = "0.5", features = ["util"] }
tracing-subscriber = "0.3"
http-body-util = "0.1"
tower-http = { version = "0.7", default-features = false, features = ["fs"] }
clap = { version = "4", features = ["derive"] }
reqwest = { version = "0.13", default-features = false, features = ["blocking", "json"] }
