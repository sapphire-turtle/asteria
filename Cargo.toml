[workspace]
resolver = "3"
members = [
    "crates/asteria-common-api",
    "crates/asteria-common-core",
    "crates/asteria-common-server",
    "crates/asteria-common-client",
    "crates/asteria-common-desktop",
    "photos/crates/asteria-photos-api",
    "photos/crates/asteria-photos-server",
    "photos/crates/asteria-photos-gui",
    "photos/headless",
    "photos/desktop",
    "photos/mobile",
    "music/crates/asteria-music-api",
    "music/crates/asteria-music-server",
    "music/crates/asteria-music-gui",
    "music/headless",
    "music/desktop",
    "music/mobile",
]

[workspace.package]
version = "0.1.0-rc.3"
edition = "2024"
license = "GPL-3.0-or-later"
repository = "https://github.com/sapphire-turtle/project-asteria"

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "1"
blake3 = "1"
crc32fast = "1"
xml-rs = "0.8"
grain-id = { version = "0.15", features = ["serde"] }
chrono = { version = "0.4", features = ["serde"] }
thiserror = "2"
uuid = { version = "1", features = ["v4", "v5", "serde"] }
unicode-normalization = "0.1"
redb = "4"
tempfile = "3"
lofty = "0.22"
tracing = "0.1"
getrandom = "0.4"
base64 = "0.23"
# The app's directories and, for the clients, the look shared with sapphire.
corundum-framework = "0.9.1"
corundum-framework-update = "0.9.1"
corundum-framework-build = "0.9.1"
corundum-framework-image = { version = "0.9.1", features = ["raw", "webp"] }
corundum-framework-audio = "0.9.1"
walkdir = "2"
tokio = { version = "1", features = ["rt", "sync", "process", "time", "io-util", "macros"] }
tokio-util = "0.7"
notify = "8"
axum = { version = "0.8", default-features = false, features = ["http1", "json", "tokio", "query"] }
tower = { version = "0.5", features = ["util"] }
tracing-subscriber = "0.3"
http-body-util = "0.1"
tower-http = { version = "0.7", default-features = false, features = ["fs"] }
clap = { version = "4", features = ["derive"] }
url = { version = "2", features = ["serde"] }
reqwest = { version = "0.13", default-features = false, features = ["blocking", "json", "rustls"] }
bytes = "1"
image = { version = "0.25", default-features = false, features = ["webp"] }
webp = "0.3"
# The server's offline audio (decode, resample, encode to Opus and mux into Ogg). The music
# client plays through corundum-framework-audio.
symphonia = { version = "0.6.1", default-features = false, features = ["flac", "mp3", "aac", "alac", "isomp4", "ogg", "vorbis", "pcm", "wav"] }
ogg = "0.9.2"
opus-pure = { version = "0.2.2", default-features = false }
rubato = "5.0.1"
# libopus, built from the bundled source (needs cmake).
opus = "0.4.0"
# The MCP endpoint of the servers (Streamable HTTP).
rmcp = { version = "3.8.0", default-features = false }
