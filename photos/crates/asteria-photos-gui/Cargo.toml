[package]
name = "asteria-photos-gui"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
publish = false

[lib]
path = "src/lib.rs"

[dependencies]
asteria-framework-api = { path = "../../../crates/asteria-framework-api", version = "2.3.0" }
asteria-framework-client = { path = "../../../crates/asteria-framework-client" }
asteria-photos-api = { path = "../asteria-photos-api" }
corundum-framework = { workspace = true, features = ["gui", "serde", "eframe"] }
tracing.workspace = true

[dev-dependencies]
# A real photos server on a temporary library, run in-process (tests/support/server.rs).
asteria-framework = { path = "../../../crates/asteria-framework" }
asteria-framework-server = { path = "../../../crates/asteria-framework-server" }
axum.workspace = true
tokio = { workspace = true, features = ["rt-multi-thread", "net"] }
grain-id.workspace = true
serde_json.workspace = true
tempfile.workspace = true
url.workspace = true
