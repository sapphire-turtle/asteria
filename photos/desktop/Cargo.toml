[package]
# The window, and the server's command line (`serve` among it) when given arguments: what
# a desktop with a GUI installs. Its binary is `asteria-photos-desktop`; the Velopack package
# names it `asteria-photos` (spec §2, #41).
name = "asteria-photos-desktop"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
publish = false

[[bin]]
name = "asteria-photos-desktop"
path = "src/main.rs"

[dependencies]
asteria-framework-client = { path = "../../crates/asteria-framework-client" }
asteria-framework-server = { path = "../../crates/asteria-framework-server" }
asteria-photos-gui = { path = "../crates/asteria-photos-gui" }
asteria-photos-server = { path = "../crates/asteria-photos-server" }
corundum-framework = { workspace = true, features = ["gui", "serde", "eframe"] }
tracing-subscriber = { workspace = true, features = ["env-filter"] }

[dev-dependencies]
tempfile.workspace = true
