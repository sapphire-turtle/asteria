[package]
name = "asteria-music-gui"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
publish = false

[lib]
path = "src/lib.rs"

[dependencies]
asteria-framework-client = { path = "../../../crates/asteria-framework-client" }
asteria-music-api = { path = "../asteria-music-api" }
tracing.workspace = true
url.workspace = true
reqwest.workspace = true
# The playback engine, its decoder and the sound device.
corundum-framework-audio = { workspace = true, features = ["cpal"] }
corundum-framework = { workspace = true, features = ["gui", "serde", "eframe"] }
getrandom.workspace = true
serde.workspace = true
serde_json.workspace = true
toml.workspace = true

[dev-dependencies]
axum.workspace = true
tokio = { workspace = true, features = ["net"] }
tempfile.workspace = true
# The stub servers in tests/support share the client crate's helpers, which want these.
asteria-framework-api = { path = "../../../crates/asteria-framework-api", version = "2.3.0" }
asteria-photos-api = { path = "../../../photos/crates/asteria-photos-api" }
grain-id.workspace = true
# The fakes of the device and the opener, for the tests.
corundum-framework-audio = { workspace = true, features = ["test-support"] }
