[package]
name = "asteria-music"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
publish = false

[lib]
path = "src/lib.rs"

[[bin]]
name = "asteria-music"
path = "src/main.rs"

[features]
# The fakes in `player::fakes`, for the integration tests (which enable it on this crate).
test-support = []

[dependencies]
asteria-framework-client = { path = "../crates/asteria-framework-client" }
asteria-music-api = { path = "../crates/asteria-music-api" }
tracing.workspace = true
url.workspace = true
reqwest.workspace = true
symphonia.workspace = true
ogg.workspace = true
opus-pure.workspace = true
rubato.workspace = true
cpal.workspace = true
rtrb.workspace = true
corundum-framework = { workspace = true, features = ["gui", "serde", "eframe"] }
getrandom.workspace = true
serde.workspace = true
serde_json.workspace = true
toml.workspace = true
tracing-subscriber = { workspace = true, features = ["env-filter"] }

[dev-dependencies]
axum.workspace = true
tokio = { workspace = true, features = ["net"] }
tempfile.workspace = true
# The stub servers in tests/support share the client crate's helpers, which want these.
asteria-framework-api = { path = "../crates/asteria-framework-api", version = "2.3.0" }
asteria-photos-api = { path = "../crates/asteria-photos-api" }
grain-id.workspace = true
# The fakes of the player, for the integration tests.
asteria-music = { path = ".", features = ["test-support"] }
