[package]
# The window, and the server's command line (`serve` among it) when given arguments: what
# a desktop with a GUI installs. Its binary is `asteria-music-desktop`; the Velopack package
# names it `asteria-music` (spec §2, #41).
name = "asteria-music-desktop"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
publish = false

[[bin]]
name = "asteria-music-desktop"
path = "src/main.rs"

# The Windows console shim the package puts on `PATH` as `asteria-music.exe`, so the GUI
# binary answers in a terminal.
[[bin]]
name = "asteria-music-console"
path = "src/bin/console.rs"

# The icon files `vpk pack --icon` takes, for the release workflow.
[[example]]
name = "icons"
path = "examples/icons.rs"

[dependencies]
asteria-framework-client = { path = "../../crates/asteria-framework-client" }
asteria-framework-desktop = { path = "../../crates/asteria-framework-desktop" }
asteria-framework-server = { path = "../../crates/asteria-framework-server" }
asteria-music-gui = { path = "../crates/asteria-music-gui" }
asteria-music-server = { path = "../crates/asteria-music-server" }
corundum-framework = { workspace = true, features = ["gui", "serde", "eframe", "service", "gui-package", "single-instance", "console"] }
tracing-subscriber = { workspace = true, features = ["env-filter"] }

[build-dependencies]
corundum-framework-build.workspace = true

[dev-dependencies]
# The player's fakes, for the window's tests.
asteria-music-gui = { path = "../crates/asteria-music-gui", features = ["test-support"] }
tempfile.workspace = true
