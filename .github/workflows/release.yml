name: Release

# Publishes a release of asteria (spec §5.9): pushing a tag `v<version>`, where <version> is
# the workspace version in Cargo.toml, creates its GitHub release (a pre-release when the
# version has a `-`, such as 0.1.0-rc.1) and attaches
#
# - each desktop app as Velopack packages for Linux (AppImage), macOS (.pkg and a portable
#   zip, one universal package) and Windows (Setup.exe and a portable zip), from which an
#   installed app updates itself; on Windows both carry libvips, and photos also carries
#   ffmpeg on Windows and macOS, pinned in packaging/tools.env (music makes its offline audio
#   itself and needs no ffmpeg);
# - each headless server as `asteria-<app>-headless-<os>-<arch>[.exe]`, which its `update`
#   command looks for.
#
# The packages are made by sapphire-turtle/.github's release-velopack.yml. The macOS packages
# are signed with a Developer ID and notarized when the repository has the MACOS_CERTIFICATE
# and APPLE_API_KEY secrets; the others are not signed yet, so Windows SmartScreen warns
# before the installer runs.
on:
  push:
    tags: ['v*']

permissions:
  contents: read

defaults:
  run:
    shell: bash

jobs:
  check:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7

      - name: Check the tag against the workspace version
        run: |
          version=$(python3 -c 'import tomllib; print(tomllib.load(open("Cargo.toml", "rb"))["workspace"]["package"]["version"])')
          if [ "$GITHUB_REF_NAME" != "v$version" ]; then
            echo "::error::The tag $GITHUB_REF_NAME is not v$version, the workspace version in Cargo.toml"
            exit 1
          fi

      # Before the other jobs, which only add files to it.
      - name: Create the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          prerelease=()
          case $GITHUB_REF_NAME in
            *-*) prerelease=(--prerelease) ;;
          esac
          gh release create "$GITHUB_REF_NAME" \
            --repo "$GITHUB_REPOSITORY" \
            --verify-tag \
            --generate-notes \
            ${prerelease[@]+"${prerelease[@]}"}

  photos-desktop:
    needs: check
    permissions:
      contents: write
    uses: sapphire-turtle/.github/.github/workflows/release-velopack.yml@v1
    # The macOS signing secrets.
    secrets: inherit
    with:
      tag: ${{ github.ref_name }}
      # Also the package id: not the data directory's name (`asteria-photos`), as on Windows
      # the package is installed in %LocalAppData%\<package id>, which its uninstall deletes.
      package: asteria-photos-desktop
      console-bin: asteria-photos-console
      # The executable's name in the package (`--mainExe`, #41).
      command: asteria-photos
      title: Asteria Photos
      # Both apps' files go to the same release; the app's channels (`photos-linux`, …) keep
      # their `releases.<channel>.json` apart. The installers keep the one-app names
      # (`asteria-photos-desktop-win-Setup.exe`, `asteria-photos-desktop.AppImage`).
      channel-prefix: photos
      icons-example: photos-icons
      linux-categories: Graphics
      linux-packages: libasound2-dev
      macos-bundle-id: net.sapphire-turtle.asteria-photos
      macos-universal: true
      smoke-test: false
      # The bundled tools, beside the main executable, where the server looks first (Linux
      # has none: there they come from the package manager). fetch-tools.sh checks the x86_64
      # ffmpeg's encoders by running it under Rosetta.
      pre-pack: |
        case $PACK_OS in
          macos)
            if ! arch -x86_64 /usr/bin/true 2> /dev/null; then
              sudo softwareupdate --install-rosetta --agree-to-license
            fi
            bash packaging/fetch-tools.sh macos photos "$PACK_DIR"
            ;;
          windows)
            bash packaging/fetch-tools.sh windows photos "$PACK_DIR"
            ;;
        esac

  music-desktop:
    needs: check
    permissions:
      contents: write
    uses: sapphire-turtle/.github/.github/workflows/release-velopack.yml@v1
    # The macOS signing secrets.
    secrets: inherit
    with:
      tag: ${{ github.ref_name }}
      # Also the package id: not the data directory's name (`asteria-music`), as on Windows
      # the package is installed in %LocalAppData%\<package id>, which its uninstall deletes.
      package: asteria-music-desktop
      console-bin: asteria-music-console
      # The executable's name in the package (`--mainExe`, #41).
      command: asteria-music
      title: Asteria Music
      # Both apps' files go to the same release; the app's channels (`music-linux`, …) keep
      # their `releases.<channel>.json` apart. The installers keep the one-app names
      # (`asteria-music-desktop-win-Setup.exe`, `asteria-music-desktop.AppImage`).
      channel-prefix: music
      icons-example: music-icons
      linux-categories: AudioVideo
      linux-packages: libasound2-dev
      macos-bundle-id: net.sapphire-turtle.asteria-music
      macos-universal: true
      smoke-test: false
      # libvips on Windows, for the cover thumbnails (macOS's sips makes them there; Linux's
      # comes from the package manager).
      pre-pack: |
        if [ "$PACK_OS" = windows ]; then
          bash packaging/fetch-tools.sh windows music "$PACK_DIR"
        fi

  # The headless servers, named after their packages (the commands are `asteria-<app>`, as
  # in the desktop packages).
  headless-photos:
    needs: check
    permissions:
      contents: write
    uses: sapphire-turtle/.github/.github/workflows/release-binary.yml@v1
    with:
      tag: ${{ github.ref_name }}
      package: asteria-photos-headless
      binary: asteria-photos
      asset: asteria-photos-headless

  headless-music:
    needs: check
    permissions:
      contents: write
    uses: sapphire-turtle/.github/.github/workflows/release-binary.yml@v1
    with:
      tag: ${{ github.ref_name }}
      package: asteria-music-headless
      binary: asteria-music
      asset: asteria-music-headless
