name: Release

# Builds a release of asteria (spec §5.9) onto its GitHub release `v<version>`, where
# <version> is the workspace version in Cargo.toml. release-plz.yml calls it when a merged
# release PR has made the tag and the release (RELEASING.md); run it by hand
# (workflow_dispatch) to build an existing tag again, or one pushed by hand, whose release
# it then creates (a pre-release when the version has a `-`, such as 0.1.0-rc.1). It attaches
#
# - each desktop app as cargo-packager packages (sapphire-turtle/.github's
#   release-packager.yml): an AppImage for Linux, a DMG (and the `.app.tar.gz` its updates
#   use) for macOS, one universal package, and an NSIS installer for Windows, each signed
#   with the organization's minisign key, and the app's update feed
#   `asteria-<app>-latest.json`, from which an installed app updates itself. Photos carries
#   libvips on Windows (for HEIC, AVIF and some RAW) and ffmpeg on Windows and macOS, pinned
#   in packaging/tools.env (music makes its covers and offline audio itself and carries no
#   tool);
# - each headless server as `asteria-<app>-headless-<os>-<arch>[.exe]`, which its `update`
#   command looks for.
#
# Secrets (`secrets: inherit`): PACKAGER_SIGN_PRIVATE_KEY and its password sign the packages,
# for the public key in crates/asteria-common-desktop/src/package.rs; the macOS package is
# signed with a Developer ID and notarized when the repository has the MACOS_CERTIFICATE and
# APPLE_API_KEY secrets. The Windows installer is not signed yet, so SmartScreen warns before
# it runs.
on:
  workflow_call:
    inputs:
      tag:
        required: true
        type: string
  workflow_dispatch:
    inputs:
      tag:
        description: 'Existing tag to build and attach the packages to (e.g. v0.1.0).'
        required: true
        type: string

permissions:
  contents: read

defaults:
  run:
    shell: bash

jobs:
  check:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.tag }}

      - name: Check the tag against the workspace version
        env:
          TAG: ${{ inputs.tag }}
        run: |
          version=$(python3 -c 'import tomllib; print(tomllib.load(open("Cargo.toml", "rb"))["workspace"]["package"]["version"])')
          if [ "$TAG" != "v$version" ]; then
            echo "::error::The tag $TAG is not v$version, the workspace version in Cargo.toml"
            exit 1
          fi

      # Before the other jobs, which only add files to it. release-plz has made it already;
      # a tag pushed by hand has none yet.
      - name: Create the release if there is none
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ inputs.tag }}
        run: |
          if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" > /dev/null 2>&1; then
            echo "The release $TAG exists"
            exit 0
          fi
          prerelease=()
          case $TAG in
            *-*) prerelease=(--prerelease) ;;
          esac
          gh release create "$TAG" \
            --repo "$GITHUB_REPOSITORY" \
            --verify-tag \
            --generate-notes \
            ${prerelease[@]+"${prerelease[@]}"}

  # The packages carry the tools fetch-tools.sh puts in the crate's `bundled/`, which
  # [package.metadata.packager]'s resources take (photos/desktop/Cargo.toml): fetched after
  # the build, with the icons rendered from the app's SVG. On macOS the icons' example is
  # built for the target the universal build already built, rather than a third time, and
  # fetch-tools.sh checks the x86_64 ffmpeg's encoders by running it under Rosetta.
  photos-desktop:
    needs: check
    permissions:
      contents: write
    uses: sapphire-turtle/.github/.github/workflows/release-packager.yml@v1
    # The signing key, and the macOS signing secrets.
    secrets: inherit
    with:
      tag: ${{ inputs.tag }}
      package: asteria-photos-desktop
      app-name: asteria-photos
      console-bin: asteria-photos-console
      command: asteria-photos
      # cpal's ALSA.
      linux-packages: libasound2-dev
      macos-universal: true
      pre-package: |
        target=()
        if [ "$PACKAGE_OS" = macos ]; then
          target=(--target aarch64-apple-darwin)
        fi
        cargo run --release --locked -p asteria-photos-desktop --example photos-icons \
          ${target[@]+"${target[@]}"} -- photos/desktop/icons
        case $PACKAGE_OS in
          macos)
            if ! arch -x86_64 /usr/bin/true 2> /dev/null; then
              sudo softwareupdate --install-rosetta --agree-to-license
            fi
            bash packaging/fetch-tools.sh macos photos photos/desktop/bundled
            ;;
          windows)
            bash packaging/fetch-tools.sh windows photos photos/desktop/bundled
            ;;
        esac

  # Music carries libvips on Windows only: on macOS sips makes its cover thumbnails.
  music-desktop:
    needs: check
    permissions:
      contents: write
    uses: sapphire-turtle/.github/.github/workflows/release-packager.yml@v1
    secrets: inherit
    with:
      tag: ${{ inputs.tag }}
      package: asteria-music-desktop
      app-name: asteria-music
      console-bin: asteria-music-console
      command: asteria-music
      linux-packages: libasound2-dev
      macos-universal: true
      pre-package: |
        target=()
        if [ "$PACKAGE_OS" = macos ]; then
          target=(--target aarch64-apple-darwin)
        fi
        cargo run --release --locked -p asteria-music-desktop --example music-icons \
          ${target[@]+"${target[@]}"} -- music/desktop/icons

  # The headless servers, named after their packages (the commands are `asteria-<app>`, as
  # in the desktop packages).
  headless-photos:
    needs: check
    permissions:
      contents: write
    uses: sapphire-turtle/.github/.github/workflows/release-binary.yml@v1
    with:
      tag: ${{ inputs.tag }}
      package: asteria-photos-headless
      binary: asteria-photos
      asset: asteria-photos-headless

  headless-music:
    needs: check
    permissions:
      contents: write
    uses: sapphire-turtle/.github/.github/workflows/release-binary.yml@v1
    with:
      tag: ${{ inputs.tag }}
      package: asteria-music-headless
      binary: asteria-music
      asset: asteria-music-headless
