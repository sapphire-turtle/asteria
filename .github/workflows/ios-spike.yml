name: iOS spike

on:
  pull_request:
    paths:
      - "spikes/**"
      - ".github/workflows/ios-spike.yml"

jobs:
  linux:
    runs-on: ubuntu-latest
    env:
      CARGO_TERM_COLOR: always
    steps:
      - uses: actions/checkout@v7
      - name: Install system packages
        run: sudo apt-get update && sudo apt-get install -y ffmpeg libasound2-dev
      - name: Install the pinned toolchain
        run: cargo --version
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: spikes/ios
      - name: Format
        run: cargo fmt --manifest-path spikes/ios/Cargo.toml --all --check
      - name: Clippy
        run: cargo clippy --manifest-path spikes/ios/Cargo.toml --all-targets -- -D warnings
      - name: Test
        run: cargo test --manifest-path spikes/ios/Cargo.toml
      - name: Compare Opus decoders
        run: cargo run --release --manifest-path spikes/ios/Cargo.toml -p opus-probe

  ios:
    runs-on: macos-latest
    env:
      CARGO_TERM_COLOR: always
    steps:
      - uses: actions/checkout@v7
      - name: Install the pinned toolchain
        run: cargo --version
      - name: Add the iOS targets
        run: rustup target add aarch64-apple-ios aarch64-apple-ios-sim
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: spikes/ios
      - name: Clippy (device)
        run: cargo clippy --manifest-path spikes/ios/Cargo.toml --target aarch64-apple-ios --all-targets -- -D warnings
      - name: Clippy (simulator)
        run: cargo clippy --manifest-path spikes/ios/Cargo.toml --target aarch64-apple-ios-sim --all-targets -- -D warnings
      - name: Install XcodeGen
        run: brew install xcodegen
      - name: Generate the Xcode project
        working-directory: spikes/ios/xcode
        run: xcodegen generate
      - name: Build for the simulator
        working-directory: spikes/ios/xcode
        run: |
          set -o pipefail
          xcodebuild -project AsteriaSpike.xcodeproj -scheme AsteriaSpike \
            -sdk iphonesimulator -configuration Debug -derivedDataPath build \
            CODE_SIGN_IDENTITY=- CODE_SIGNING_ALLOWED=YES CODE_SIGNING_REQUIRED=NO build 2>&1 | tee xcodebuild.log | tail -n 200
      - name: Boot a simulator
        run: |
          udid=$(xcrun simctl list devices available --json \
            | jq -r '[.devices[][] | select(.name | startswith("iPhone"))][0].udid')
          if [ -z "$udid" ] || [ "$udid" = "null" ]; then
            echo "no iPhone simulator available" >&2
            xcrun simctl list devices available >&2
            exit 1
          fi
          echo "SIM_UDID=$udid" >> "$GITHUB_ENV"
          xcrun simctl boot "$udid"
          xcrun simctl bootstatus "$udid" -b
      - name: Install and launch the app
        working-directory: spikes/ios/xcode
        run: |
          app=build/Build/Products/Debug-iphonesimulator/AsteriaSpike.app
          bundle_id=$(/usr/libexec/PlistBuddy -c 'Print :CFBundleIdentifier' "$app/Info.plist")
          expected=$(sed -n 's/^PRODUCT_BUNDLE_IDENTIFIER *= *//p' Local.xcconfig.example)
          if [ "$bundle_id" != "$expected" ]; then
            echo "::error::built bundle id '$bundle_id' != '$expected' from Local.xcconfig.example"
            exit 1
          fi
          codesign -dv "$app" 2>&1 || true
          echo "bundle id: $bundle_id"
          xcrun simctl install "$SIM_UDID" "$app"
          out="$PWD/console.log"; err="$PWD/console-stderr.log"
          : > "$out"; : > "$err"
          # SpringBoard may not be ready right after boot, so launching can hang or
          # fail; retry with a per-attempt timeout until simctl prints a pid.
          pid=""
          for attempt in 1 2 3 4 5 6; do
            echo "launch attempt $attempt"
            result=$(perl -e 'alarm 30; exec @ARGV' xcrun simctl launch \
              --stdout="$out" --stderr="$err" "$SIM_UDID" "$bundle_id" 2>&1) || true
            echo "$result"
            pid=$(echo "$result" | sed -n "s/^$bundle_id: *\([0-9][0-9]*\)\$/\1/p")
            [ -n "$pid" ] && break
            sleep 10
          done
          if [ -z "$pid" ]; then
            echo "::error::the app never launched"
            exit 1
          fi
          echo "launched with pid $pid"
          sleep 20
          # The app must still be running in the simulator...
          if ! xcrun simctl spawn "$SIM_UDID" launchctl list \
              | grep "UIKitApplication:$bundle_id" | grep -qE '^[0-9]+'; then
            echo "::error::the app is not running after 20 seconds"
            xcrun simctl spawn "$SIM_UDID" launchctl list | grep -i asteria || true
            echo "---- console ----"; cat "$out" "$err"
            exit 1
          fi
          # ...and must have reached our code without returning from eframe.
          for i in 1 2 3 4 5; do
            xcrun simctl spawn "$SIM_UDID" log show --last 3m --style compact --info --debug \
              --predicate 'process == "AsteriaSpike"' > simulator-log.txt 2>&1 || true
            grep -q "asteria_spike_main: start" simulator-log.txt && break
            sleep 5
          done
          if ! grep -q "asteria_spike_main: start" simulator-log.txt; then
            echo "::error::no 'asteria_spike_main: start' in the unified log"
            tail -n 50 simulator-log.txt; cat "$out" "$err"
            exit 1
          fi
          if grep -qE "run failed|panicked|eframe returned|panic:" simulator-log.txt; then
            echo "::error::the app logged a failure or exited its event loop"
            grep -E "asteria_spike" simulator-log.txt
            exit 1
          fi
          xcrun simctl io "$SIM_UDID" screenshot screenshot.png
          echo "---- console ----"; cat "$out" "$err"
      - name: Collect simulator logs and crash reports
        if: always()
        working-directory: spikes/ios/xcode
        run: |
          if [ -n "${SIM_UDID:-}" ]; then
            xcrun simctl spawn "$SIM_UDID" log show --last 2m --style compact --info --debug \
              --predicate 'process == "AsteriaSpike"' > simulator-log.txt 2>&1 || true
          fi
          mkdir -p crash-reports
          cp ~/Library/Logs/DiagnosticReports/AsteriaSpike* crash-reports/ 2>/dev/null || true
          ls crash-reports > /dev/null
      - name: Show diagnostics on failure
        if: failure()
        working-directory: spikes/ios/xcode
        run: |
          grep -n "error:" xcodebuild.log || true
          tail -n 100 xcodebuild.log || true
          echo "---- console.log ----"; cat console.log || true
          echo "---- simulator-log.txt (tail) ----"; tail -n 100 simulator-log.txt || true
          for f in crash-reports/*; do
            [ -f "$f" ] && { echo "---- $f (head) ----"; head -n 80 "$f"; }
          done
          exit 0
      - name: Upload screenshot and console output
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ios-simulator
          path: |
            spikes/ios/xcode/screenshot.png
            spikes/ios/xcode/console.log
            spikes/ios/xcode/console-stderr.log
            spikes/ios/xcode/xcodebuild.log
            spikes/ios/xcode/simulator-log.txt
            spikes/ios/xcode/crash-reports/
          if-no-files-found: warn
