name: iOS spike

on:
  pull_request:
    paths:
      - "spikes/**"
      - ".github/workflows/ios-spike.yml"

jobs:
  linux:
    runs-on: ubuntu-latest
    env:
      CARGO_TERM_COLOR: always
    steps:
      - uses: actions/checkout@v7
      - name: Install system packages
        run: sudo apt-get update && sudo apt-get install -y ffmpeg libasound2-dev
      - name: Install the pinned toolchain
        run: cargo --version
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: spikes/ios
      - name: Format
        run: cargo fmt --manifest-path spikes/ios/Cargo.toml --all --check
      - name: Clippy
        run: cargo clippy --manifest-path spikes/ios/Cargo.toml --all-targets -- -D warnings
      - name: Test
        run: cargo test --manifest-path spikes/ios/Cargo.toml
      - name: Compare Opus decoders
        run: cargo run --release --manifest-path spikes/ios/Cargo.toml -p opus-probe
